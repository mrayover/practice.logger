name: Android APK
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Optional diagnostic class (full package); empty runs full release gates'
        required: false
        default: ''
      api:
        description: 'Diagnostic Android API'
        required: false
        default: '26'
        type: choice
        options: ['26', '35']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.test_class }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Targeted Goals data, migration and backup checks
        run: bash ./gradlew testDebugUnitTest --tests '*.GoalRepositoryTest' --stacktrace
      - name: Build, test and lint
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Record schema for migration baseline
        run: cat app/schemas/com.mrayover.practicelogger.BlockDatabase/8.json
      - uses: actions/upload-artifact@v4
        with:
          name: practice-logger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: practice-logger-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/test-results
            app/schemas
          retention-days: 30
  device:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell locksettings set-disabled true
            adb shell wm dismiss-keyguard
            adb shell pm clear com.mrayover.practicelogger.app || true
            bash ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.mrayover.practicelogger.LaunchTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=120000 --stacktrace || { adb logcat -d > app/build/catalog-failure-log.txt; adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/catalog-failure-screenshots; exit 1; }
            cp -R app/build/reports/androidTests app/build/catalog-workflow-reports
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.ProcessReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/process-reopen.txt
            grep -q "OK (1 test)" app/build/process-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.PracticeWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/practice-workflow.txt
            grep -q "OK (1 test)" app/build/practice-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.PracticeRecoveryTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/practice-recovery.txt
            grep -q "OK (1 test)" app/build/practice-recovery.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.HistoryReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/history-reopen.txt
            grep -q "OK (1 test)" app/build/history-reopen.txt
            bash ./gradlew assembleDebug -PversionCodeOverride=19 --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.HistoryReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/upgrade-reopen.txt
            grep -q "OK (1 test)" app/build/upgrade-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.BackupWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/backup-workflow.txt
            grep -q "OK (1 test)" app/build/backup-workflow.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.SystemPickerExportTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/picker-export.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/picker-screenshots
            grep -q "OK (1 test)" app/build/picker-export.txt
            adb shell pm clear com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.SystemPickerRestoreTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/picker-restore.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/restore-screenshots
            grep -q "OK (1 test)" app/build/picker-restore.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.SystemPickerReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/picker-reopen.txt
            grep -q "OK (1 test)" app/build/picker-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.MultipleSessionWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/multi-workflow.txt
            grep -q "OK (1 test)" app/build/multi-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.MultipleSessionReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/multi-reopen.txt
            grep -q "OK (1 test)" app/build/multi-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.MetronomeWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/metronome-workflow.txt
            grep -q "OK (1 test)" app/build/metronome-workflow.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.RecordingWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/recording-workflow.txt
            adb logcat -b crash -d > app/build/recording-crash-log.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/recording-screenshots
            grep -q "OK (1 test)" app/build/recording-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.RecordingReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/recording-reopen.txt
            grep -q "OK (1 test)" app/build/recording-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.PhraseWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/phrase-workflow.txt
            adb logcat -b crash -d > app/build/phrase-crash-log.txt
            adb logcat -d -s PhraseCapture AudioTrack AudioRecord > app/build/phrase-audio-log.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/phrase-screenshots
            grep -q "OK (1 test)" app/build/phrase-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.PhraseReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/phrase-reopen.txt
            grep -q "OK (1 test)" app/build/phrase-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.ToolsWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/tools-workflow.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/tools-screenshots
            grep -q "OK (1 test)" app/build/tools-workflow.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.FreeRecordingWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/free-recording-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.FreeRecordingReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/free-recording-reopen.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/free-recording-screenshots
            grep -q "OK (1 test)" app/build/free-recording-workflow.txt
            grep -q "OK (1 test)" app/build/free-recording-reopen.txt
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.RoutineWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/routine-workflow.txt
            grep -q "OK (1 test)" app/build/routine-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.RoutineReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/routine-reopen.txt
            grep -q "OK (1 test)" app/build/routine-reopen.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/routine-screenshots
            adb shell am instrument -w -r -e timeout_msec 120000 -e class com.mrayover.practicelogger.GoalWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/goal-workflow.txt
            adb logcat -d > app/build/goal-log.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/goal-screenshots
            grep -q "OK (1 test)" app/build/goal-workflow.txt
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e timeout_msec 120000 -e class com.mrayover.practicelogger.GoalReopenTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/goal-reopen.txt
            grep -q "OK (1 test)" app/build/goal-reopen.txt
            adb shell settings put system font_scale 2.0
            adb shell am force-stop com.mrayover.practicelogger.app
            adb shell am instrument -w -r -e class com.mrayover.practicelogger.AccessibilityWorkflowTest com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/accessibility-workflow.txt
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/accessibility-screenshots
            grep -q "OK (1 test)" app/build/accessibility-workflow.txt
            adb shell settings put system font_scale 1.0
            adb shell am force-stop com.mrayover.practicelogger.app
            adb pull /sdcard/Android/data/com.mrayover.practicelogger.app/files/screenshots app/build/device-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/catalog-workflow-reports
            app/build/catalog-failure-log.txt
            app/build/catalog-failure-screenshots
            app/build/goal-*.txt
            app/build/goal-screenshots
            app/build/routine-*.txt
            app/build/routine-screenshots
            app/build/multi-*.txt
            app/build/metronome-workflow.txt
            app/build/free-recording-*.txt
            app/build/free-recording-screenshots
            app/build/tools-workflow.txt
            app/build/tools-screenshots
            app/build/recording-*.txt
            app/build/recording-screenshots
            app/build/phrase-*.txt
            app/build/phrase-screenshots
            app/build/process-reopen.txt
            app/build/practice-workflow.txt
            app/build/practice-recovery.txt
            app/build/history-reopen.txt
            app/build/upgrade-reopen.txt
            app/build/backup-workflow.txt
            app/build/accessibility-workflow.txt
            app/build/picker-*.txt
            app/build/accessibility-screenshots
            app/build/picker-screenshots
            app/build/restore-screenshots
            app/build/device-screenshots
          retention-days: 30

  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_class != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-AndroidClass.sh
        env:
          TARGET_TEST_CLASS: ${{ inputs.test_class }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-device-${{ inputs.api }}
          path: |
            app/build/targeted-*
          retention-days: 30
