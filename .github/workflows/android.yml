name: Android APK
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Record schema for migration baseline
        run: cat app/schemas/com.mrayover.practicelogger.BlockDatabase/1.json
      - uses: actions/upload-artifact@v4
        with:
          name: practice-logger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/test-results
            app/schemas
          retention-days: 30
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb shell pm clear com.mrayover.practicelogger || true
            bash ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.mrayover.practicelogger.LaunchTest --stacktrace
            cp -R app/build/reports/androidTests app/build/catalog-workflow-reports
            adb shell am force-stop com.mrayover.practicelogger
            bash ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.mrayover.practicelogger.ProcessReopenTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/catalog-workflow-reports
          retention-days: 30
