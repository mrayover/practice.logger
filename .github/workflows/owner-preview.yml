name: Owner-test preview (build and launch only)
on:
  workflow_dispatch:
    inputs:
      check:
        description: Focused preview check
        type: choice
        options: [waveform, learning, statistics, home, metronome, practice-refinement, practice-layout, loop-refinement]
        default: home
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare focused recording fixtures
        if: inputs.check == 'waveform'
        run: AUDIO_FIXTURE_DURATION=3 AUDIO_FIXTURE_WAV=true bash scripts/Prepare-AudioFixtures.sh
      - name: Focused recording waveform checks
        if: inputs.check == 'waveform'
        run: bash ./gradlew lintVitalRelease testDebugUnitTest --tests 'com.mrayover.practicelogger.RecordingWaveformTest' --console=plain
      - name: Compile owner-test preview (full regression pending)
        run: bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - name: Focused LGE data, suggestions and accounting checks
        if: inputs.check == 'learning'
        run: bash ./gradlew lintVitalRelease testDebugUnitTest --tests 'com.mrayover.practicelogger.LearningRepositoryTest' --tests 'com.mrayover.practicelogger.LearningSuggestionsTest' --tests 'com.mrayover.practicelogger.AdaptiveSchedulingTest' --tests 'com.mrayover.practicelogger.PracticeStatisticsTest' --console=plain
      - name: Focused G3 statistics checks
        if: inputs.check == 'statistics'
        run: bash ./gradlew testDebugUnitTest --tests 'com.mrayover.practicelogger.PracticeStatisticsTest' --console=plain
      - name: Focused loop timing and storage checks
        if: inputs.check == 'loop-refinement'
        run: bash ./gradlew testDebugUnitTest --tests 'com.mrayover.practicelogger.PhraseAudioTest' --tests 'com.mrayover.practicelogger.PhraseRepositoryTest'
      - uses: actions/upload-artifact@v4
        with:
          name: practice-logger-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: practice-logger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Single API35 install and launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-PreviewLaunch.sh
        env:
          PREVIEW_TEST_CLASS: ${{ inputs.check == 'waveform' && 'RecordingWaveformWorkflowTest' || inputs.check == 'learning' && 'LearningWorkflowTest' || inputs.check == 'statistics' && 'StatisticsNavigationTest' || inputs.check == 'loop-refinement' && 'LoopRecorderPreviewTest' || inputs.check == 'practice-layout' && 'PracticeRefinementPreviewTest' || inputs.check == 'practice-refinement' && 'PracticeRefinementPreviewTest,com.mrayover.practicelogger.MetronomeButtonPulseTest' || inputs.check == 'metronome' && 'MetronomeButtonPulseTest' || 'HomeNavigationPreviewTest' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-preview-launch-evidence
          path: |
            app/build/preview-*
            app/build/test-results/testDebugUnitTest
