name: Submarine theme targeted checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Theme unit tests and release APK
        run: bash ./gradlew testDebugUnitTest --tests '*ThemePaletteTest' --tests '*ThemePreferencesTest' assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submarine-theme-checks
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/test-results/testDebugUnitTest
