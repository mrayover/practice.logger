name: Smooth theme focused checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run scoped persistence and metronome tests
        run: |
          timeout 420s bash ./gradlew testDebugUnitTest --tests '*ThemePaletteTest' --tests '*ThemePreferencesTest' assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-theme-apks
          path: app/build/outputs/apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-SmoothTheme.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smooth-theme-evidence
          path: |
            app/build/smooth-theme
            app/build/test-results/testDebugUnitTest
