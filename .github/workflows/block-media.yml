name: L3 Block media focused checks
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [build, package, native, ui]
        default: build
      api:
        type: choice
        options: ['35', '26']
        default: '35'
      font_scale:
        type: choice
        options: ['1.0', '2.0']
        default: '1.0'
      fixture_run:
        description: 'Optional successful L2 build run whose identical generated test audio should be reused'
        type: string
        default: '41721617835'
      compiled_run:
        description: 'Successful L3 build to reuse after verifying identical app and test source'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Codec fixtures
        env:
          AUDIO_FIXTURE_DURATION: '4.0'
          FIXTURE_RUN: ${{ inputs.fixture_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FIXTURE_RUN" ]; then
            [[ "$FIXTURE_RUN" =~ ^[0-9]+$ ]]
            gh run download "$FIXTURE_RUN" --repo '${{ github.repository }}' -n l2-build --dir "$RUNNER_TEMP/l2-fixtures"
            test_apk=$(find "$RUNNER_TEMP/l2-fixtures" -name app-debug-androidTest.apk -print -quit)
            test -n "$test_apk"
            mkdir -p app/src/androidTest/assets/audio
            for ext in mp3 m4a wav; do
              unzip -p "$test_apk" "assets/audio/backing.$ext" > "app/src/androidTest/assets/audio/backing.$ext"
              test -s "app/src/androidTest/assets/audio/backing.$ext"
            done
          else
            bash scripts/Prepare-AudioFixtures.sh
            ffmpeg -y -v error -f lavfi -i 'sine=frequency=440:duration=4' -ar 44100 -ac 1 -c:a pcm_s16le app/src/androidTest/assets/audio/backing.wav
          fi
      - name: Compile and focused units
        if: ${{ inputs.compiled_run == '' }}
        run: |
          if [ '${{ inputs.scope }}' = build ]; then
            bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest --tests '*BlockMedia*Test' --tests '*BlockRepositoryTest' --tests '*BlockDeletionTest' --tests '*Media*Test' --tests '*Library*Test' --tests '*ImageReferenceTest' --tests '*ImageMigrationTest' --tests '*PdfReferenceTest' --tests '*AudioImportTest' --tests '*RecordingRepositoryTest' --tests '*PhraseRepositoryTest' --tests '*StandaloneRecordingTest' --tests '*BackupRepositoryTest' --tests '*BackupFailureTest' --stacktrace
          elif [ '${{ inputs.scope }}' = package ]; then
            bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace
          else
            bash ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          fi
      - name: Reuse verified compilation
        if: ${{ inputs.compiled_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILED_RUN: ${{ inputs.compiled_run }}
        run: |
          [[ "$COMPILED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$COMPILED_RUN" --jq .conclusion)" = success
          compiled_sha=$(gh api "repos/${{ github.repository }}/actions/runs/$COMPILED_RUN" --jq .head_sha)
          git fetch origin "$compiled_sha" --depth=1
          git diff --exit-code "$compiled_sha" HEAD -- app/src app/build.gradle.kts app/schemas
          gh run download "$COMPILED_RUN" --repo '${{ github.repository }}' -n l3-build --dir compiled
          mkdir -p app/build
          cp -R compiled/build/outputs app/build/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-build
          path: |
            app/build/outputs/apk
            app/build/test-results/testDebugUnitTest
            app/schemas
      - name: Emulator acceleration
        if: ${{ inputs.scope != 'build' && inputs.scope != 'package' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Immutable build76 baseline
        if: ${{ inputs.scope == 'native' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41721617835 --repo '${{ github.repository }}' -n l2-build --dir baseline76
          test -s baseline76/build/outputs/apk/debug/app-debug.apk
      - name: Disposable emulator signatures with exact payload verification
        if: ${{ inputs.scope != 'build' && inputs.scope != 'package' }}
        run: |
          test_key="$RUNNER_TEMP/l3-emulator.p12"
          keytool -genkeypair -keystore "$test_key" -storepass android -keypass android -storetype PKCS12 -alias androiddebugkey -keyalg RSA -validity 3 -dname CN=L3Emulator
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk baseline76/build/outputs/apk/debug/app-debug.apk; do
            if [ ! -f "$apk" ]; then continue; fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$test_key" --ks-pass pass:android --key-pass pass:android --out "$apk.resigned" "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk.resigned"
            python3 - "$apk" "$apk.resigned" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as old, zipfile.ZipFile(sys.argv[2]) as new:
              names = {n for n in old.namelist() if not n.startswith('META-INF/')}
              assert names == {n for n in new.namelist() if not n.startswith('META-INF/')}
              assert all(old.read(n) == new.read(n) for n in names)
          PY
            mv "$apk.resigned" "$apk"
          done
      - uses: reactivecircus/android-emulator-runner@v2
        if: ${{ inputs.scope != 'build' && inputs.scope != 'package' }}
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-BlockMedia.sh '${{ inputs.scope }}' '${{ inputs.font_scale }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-native-${{ inputs.api }}
          path: app/build/l3-native
