name: Stage 3B persistence and portable compatibility
on:
  push:
    branches: [block-ux-stage1]
    paths: [.github/workflows/multi-reference.yml]
  workflow_dispatch:
    inputs:
      classes:
        description: 'Comma-separated native classes (package names optional)'
        default: 'MultiReferenceNativeTest,MultiReferenceWalPersistenceTest,FrozenPortableCompatibilityTest,BlockEditorNativeTest,BlockMediaNativeTest,MediaLibraryStorageTest,PortableZipCreationTest,PortableRestoreTest,PortableArchiveValidationTest,process-death,portable-install'
        type: string
      native_only:
        description: 'Only compile native test packages when unchanged source already passed units/release'
        default: false
        type: boolean
      keep_going:
        description: 'Collect independent regression groups after a failure; overall result still fails'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Native codec fixtures
        env:
          AUDIO_FIXTURE_DURATION: '4.0'
        run: bash scripts/Prepare-AudioFixtures.sh
      - name: Compile and preservation units
        if: ${{ !inputs.native_only }}
        run: bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest --tests '*MultiReference*Test' --tests '*BlockAudioTest' --tests '*PracticeOverlayRepositoryTest' --tests '*BlockDeletionTest' --tests '*BlockEditorSaveTest' --tests '*Backup*Test' --tests '*SessionRepositoryTest' --tests '*RoutineRepositoryTest' --tests '*GoalRepositoryTest' --tests '*Week*Test' --console=plain
      - name: Compile native regression packages
        if: ${{ inputs.native_only }}
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-MultiReference.sh
        env:
          MULTI_REFERENCE_CLASSES: ${{ inputs.classes || 'MultiReferenceNativeTest,MultiReferenceWalPersistenceTest,FrozenPortableCompatibilityTest,BlockEditorNativeTest,BlockMediaNativeTest,MediaLibraryStorageTest,PortableZipCreationTest,PortableRestoreTest,PortableArchiveValidationTest,process-death,portable-install' }}
          MULTI_REFERENCE_CONTINUE: ${{ inputs.keep_going }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3b-api-${{ matrix.api }}
          path: |
            app/build/stage3b
            app/build/test-results/testDebugUnitTest
            app/schemas
