name: K1 Reference Piano focused checks
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [build, native]
        default: build
      api:
        type: choice
        options: ['26', '35']
        default: '35'
      font_scale:
        type: choice
        options: ['1.0', '2.0']
        default: '1.0'
      compiled_run:
        description: 'Reuse successful K1 compilation after checking source equivalence'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  piano:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and scoped units
        if: ${{ inputs.compiled_run == '' }}
        run: bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest --tests '*Piano*Test' --tests '*Tools*Test' --tests '*Tuner*Test' --tests '*LibraryAudio*Test' --stacktrace
      - name: Reuse verified compilation
        if: ${{ inputs.compiled_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILED_RUN: ${{ inputs.compiled_run }}
        run: |
          [[ "$COMPILED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$COMPILED_RUN" --jq .conclusion)" = success
          compiled_sha=$(gh api "repos/${{ github.repository }}/actions/runs/$COMPILED_RUN" --jq .head_sha)
          git fetch origin "$compiled_sha" --depth=1
          git diff --exit-code "$compiled_sha" HEAD -- app/src app/build.gradle.kts app/schemas
          gh run download "$COMPILED_RUN" --repo '${{ github.repository }}' -n k1-build --dir compiled
          mkdir -p app/build
          cp -R compiled/outputs app/build/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k1-build
          path: |
            app/build/outputs/apk
            app/build/test-results/testDebugUnitTest
      - name: Emulator acceleration
        if: ${{ inputs.scope == 'native' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: ${{ inputs.scope == 'native' }}
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-Piano.sh '${{ inputs.font_scale }}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.scope == 'native' }}
        with:
          name: k1-native-${{ inputs.api }}
          path: app/build/k1-native
