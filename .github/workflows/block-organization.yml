name: Block organization candidate
on:
  push:
    branches: [block-organization-stage1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run scoped unit checks
        run: |
          bash ./gradlew assembleDebug testDebugUnitTest --tests '*BlockRepositoryTest' --tests '*MediaLibraryTest' --tests '*WeekPlanTest' --tests '*OrganizationTest' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organization-build-reports
          path: |
            app/build/reports
            app/build/test-results
            app/schemas
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: organization-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
