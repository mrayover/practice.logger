name: Build 157 Android M4A compatibility
on:
  push:
    branches: [verify-build157-m4a]
permissions:
  contents: read
jobs:
  m4a:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2eb8bd6db987a612a65865f194f0dda270eba62
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -o pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class 'com.mrayover.practicelogger.M4aImportCompatibilityTest#alternativeProviderMimeStillRequiresValidAacContent' com.mrayover.practicelogger.app.test/androidx.test.runner.AndroidJUnitRunner | tee m4a-result.txt
            grep -q 'OK (1 test)' m4a-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build157-m4a-result
          path: m4a-result.txt
