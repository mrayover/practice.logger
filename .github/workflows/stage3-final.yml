name: Stage 3 final build and signed upgrade
on:
  push:
    branches: [block-ux-stage1]
    paths: [.github/workflows/stage3-final.yml]
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [build, signed-upgrade]
        default: build
      staging_release:
        description: 'Temporary draft release ID with public signed APK bytes only'
        type: string
        default: ''
      expected_build:
        type: string
        default: '111'
permissions:
  contents: read
jobs:
  build:
    if: inputs.scope == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Native codec fixtures
        run: AUDIO_FIXTURE_DURATION=4.0 AUDIO_FIXTURE_WAV=true bash scripts/Prepare-AudioFixtures.sh
      - name: Full unit suite and release/test assembly
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest --console=plain
      - name: Full lint report (five known baseline errors; separately reported)
        continue-on-error: true
        run: bash ./gradlew lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-final-build
          path: |
            app/build/outputs/apk
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.*
  signed-upgrade:
    if: inputs.scope == 'signed-upgrade'
    permissions:
      contents: write # GitHub requires push access to read temporary draft release assets.
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Download signed test packages (no signing keys)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.staging_release }}
        run: |
          mkdir -p signed-packages
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > signed-packages/assets.json
          for name in baseline.apk update.apk tests.apk; do
            id=$(jq -r --arg name "$name" '.[]|select(.name==$name)|.id' signed-packages/assets.json)
            test -n "$id"
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "signed-packages/$name"
          done
          sha256sum signed-packages/*.apk | tee signed-packages/SHA256SUMS.txt
      - name: Emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-SignedRoom24Upgrade.sh
        env:
          EXPECTED_BUILD: ${{ inputs.expected_build }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-signed-upgrade-api-${{ matrix.api }}
          path: app/build/stage3-signed-upgrade
