name: L1 Media Library scoped checks
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [build, native, all]
        default: build
      api:
        type: choice
        options: ['35', '26']
        default: '35'
      font_scale:
        type: choice
        options: ['1.0', '2.0']
        default: '1.0'
      scenario:
        type: choice
        options: [all, ownership, storage, library]
        default: all
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate existing codec fixtures
        env:
          AUDIO_FIXTURE_DURATION: '2.5'
        run: bash scripts/Prepare-AudioFixtures.sh
      - name: Compile app, release, instrumentation and scoped storage checks
        run: |
          if [ '${{ inputs.scope }}' = native ]; then
            bash ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          else
            bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest --tests '*MediaLibraryTest' --tests '*MediaMigrationTest' --tests '*ImageReferenceTest' --tests '*ImageMigrationTest' --tests '*PdfReferenceTest' --tests '*AudioImportTest' --tests '*RecordingRepositoryTest' --tests '*PhraseRepositoryTest' --tests '*StandaloneRecordingTest' --tests '*BackupRepositoryTest' --tests '*BackupFailureTest' --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-build
          path: |
            app/build/outputs/apk
            app/build/test-results/testDebugUnitTest
            app/schemas
      - name: Enable emulator acceleration
        if: ${{ inputs.scope != 'build' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
        if: ${{ inputs.scope != 'build' }}
        with:
          ref: 9c723442d8f3eb1dd8c2d23cc76dd3af4de7e1d3
          path: baseline-source
          persist-credentials: false
      - name: Rebuild immutable build69 install-over baseline
        if: ${{ inputs.scope != 'build' }}
        run: bash scripts/Build-ReferenceBaseline.sh
      - uses: reactivecircus/android-emulator-runner@v2
        if: ${{ inputs.scope != 'build' }}
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-MediaLibrary.sh '${{ inputs.font_scale }}' '${{ inputs.scenario }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-native-${{ inputs.api }}
          path: app/build/l1-native
