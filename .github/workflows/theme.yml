name: Centralized themes focused verification
on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: 'Reuse APKs from a successful build job (empty builds current source)'
        required: false
        default: ''
      scope:
        description: 'Theme-only diagnostics or complete focused checks'
        type: choice
        options: [all, theme]
        default: all
      api:
        description: 'Native diagnostic API'
        type: choice
        options: [all, '26', '35']
        default: all
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.apk_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Focused palette, persistence and existing audio checks; compile variants
        run: |
          if [ "${{ inputs.scope }}" = all ]; then
            bash ./gradlew testDebugUnitTest --tests '*ThemePaletteTest' --tests '*ThemePreferencesTest' --tests '*AudioSettingsPcmTest' --tests '*PhraseAudioTest' --stacktrace
          fi
          bash ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: theme-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-unit-evidence
          path: app/build/test-results/testDebugUnitTest
  native:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.apk_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.api == 'all' && '[26,35]' || format('[{0}]', inputs.api)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: theme-apks
          path: app/build/outputs/apk
          run-id: ${{ inputs.apk_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Focused theme UI and lifecycle checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/Check-Themes.sh ${{ matrix.api }} ${{ inputs.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-native-${{ matrix.api }}
          path: app/build/theme-*
